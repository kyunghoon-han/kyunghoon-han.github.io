<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM</title>

  <!-- js-dos v8 -->
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: Tahoma, "MS Sans Serif", sans-serif;
      color: #c0c0c0;
      overflow: hidden;
    }
    #dos { width: 100%; height: 100%; }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #008080;
      padding: 16px;
      box-sizing: border-box;
      cursor: pointer;
      z-index: 10;
    }
    #overlay.hidden { display: none; }

    .panel {
      background: #c0c0c0;
      border: 2px solid #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      box-shadow: 1px 1px 0 #000;
      padding: 18px 22px;
      max-width: 380px;
      color: #000;
      text-align: center;
    }
    .panel h1 { font-size: 17px; margin: 0 0 10px; letter-spacing: 1px; }
    .panel p  { font-size: 12px; line-height: 1.5; margin: 0 0 14px; }
    .panel small { font-size: 11px; color: #404040; display: block; margin-top: 10px; }

    button.play {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 22px;
      background: #c0c0c0;
      border: 2px solid #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      cursor: pointer;
    }
    button.play:active {
      border: 2px solid #404040;
      border-right-color: #fff;
      border-bottom-color: #fff;
    }
    .mobile-note { display: none; font-size: 11px; color: #800000; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="overlay">
    <div class="panel">
      <h1>DOOM (1993)</h1>
      <p>Shareware episode &mdash; Knee-Deep in the Dead.<br>
         Click anywhere to play.</p>
      <button class="play" id="launch">&#9658;&nbsp; Start</button>
      <p class="mobile-note" id="mobileNote">
        You appear to be on a touch device. DOOM needs a keyboard and is
        basically unplayable without one.
      </p>
      <small>Arrows = move &middot; Ctrl = fire &middot; Space = use/open.</small>
    </div>
  </div>

  <div id="dos"></div>

  <script>
    (function () {
      var launched = false;

      if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
        document.getElementById("mobileNote").style.display = "block";
      }

      function start() {
        if (launched) return;
        launched = true;
        document.getElementById("overlay").classList.add("hidden");

        // doom.jsdos sits next to this file (htmls/doom.jsdos)
        Dos(document.getElementById("dos"), {
          url: "doom.jsdos",
          autoStart: true,   // skip the play button
          noCloud: true,     // hide cloud-save / subscription panel
          kiosk: true         // hide the js-dos sidebar/chrome
        });

        // Focus the canvas so keys go to the game, not the page.
        var host = document.getElementById("dos");
        host.addEventListener("click", function () {
          var c = host.querySelector("canvas");
          if (c) { c.setAttribute("tabindex", "0"); c.focus(); }
        });
      }

      // Click anywhere on the overlay to launch (this user gesture also
      // unlocks browser audio so DOOM has sound).
      document.getElementById("overlay").addEventListener("click", start);
    })();
  </script>
</body>
</html>
